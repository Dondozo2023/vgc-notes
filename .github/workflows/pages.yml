name: Build and publish VGC Notes
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
env:
  HUGO_VERSION: 0.167.0
  TZ: Asia/Tokyo
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate tournament records
        run: node scripts/validate.mjs
      - name: Set up Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Install verified Hugo release
        run: |
          mkdir -p "$RUNNER_TEMP/vgc-hugo"
          cd "$RUNNER_TEMP/vgc-hugo"
          curl --fail --location --silent --show-error --output hugo.tar.gz "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl --fail --location --silent --show-error --output checksums.txt "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_checksums.txt"
          expected=$(awk -v file="hugo_${HUGO_VERSION}_linux-amd64.tar.gz" '$2 == file {print $1}' checksums.txt)
          test -n "$expected"
          printf '%s  hugo.tar.gz\n' "$expected" | sha256sum --check
          tar -xzf hugo.tar.gz
          printf '%s\n' "$RUNNER_TEMP/vgc-hugo" >> "$GITHUB_PATH"
      - name: Build
        run: hugo build --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
          retention-days: 1
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5
